cluster_name: int_subword_alu
provider:
  head_ip: ${THIS_MACHINE}
auth:
  ssh_user: ${USER}
  overrides:
    <IP>:
      tunnel:
        gcs_tunnel_port: 6395
        head_worker_port_min: 21000
        head_worker_port_max: 21399
        ray_worker_port_min: 30000
        ray_worker_port_max: 30199
        pre_tunnel_commands:
        - bash $REMOTE_HOME/chialu-home/start_relay.sh
available_node_types:
  eda:
    resources:
      eda: 124
      opencode_creds: 100
    num_workers: 1
    compatible_ips:
    - ${THIS_MACHINE}
    worker_env_commands:
    - source $CHIALU_HOME/chialu-env.sh
    - export RAY_num_workers_soft_limit=150
    - export VERTEX_LOCATION=global
  eda_<host>:
    resources:
      eda: 84
      opencode_creds: 0
    num_workers: 1
    compatible_ips:
    - ${<host>_MACHINE}
    worker_env_commands:
    - source $REMOTE_HOME/chialu-home/chialu-env.sh
head_env_commands:
- source $CHIALU_HOME/chialu-env.sh
- export VERTEX_LOCATION=global
- export RAY_num_workers_soft_limit=150
head_start_ray_commands:
- ray stop
- ray start --head --port=${CHIA_RAY_PORT} --include-dashboard=false --dashboard-agent-listen-port=0
worker_start_ray_commands:
- ray stop
- ray start --address=$RAY_HEAD_IP:${CHIA_RAY_PORT} --dashboard-agent-listen-port=0
cache:
  conformance:
    cache: true
  fault:
    cache: true
  synth_unit:
    cache: true
  synth_ppa:
    cache: true
adir:
  module: chialu.ALU
  run_dir: run/int_subword_alu
  variables:
    modes:
      runtime:
      - count: 1
        format: int16
      - count: 1
        format: uint16
      - count: 2
        format: int8
    ops:
      runtime:
      - add
      - sub
      - adc
      - neg
      - abs
      - add_sat
      - mul
      - mul_high
      - min
      - max
      - cmp
      - shl
      - shr_arith
      - rol
      - and
      - or
      - xor
      - not
      - popcount
      - clz
      - ctz
    accuracy:
      fixed: exact
    check:
      fixed:
        default:
          detect: none
        fallback: duplicate
        rules:
        - name: all
          formats:
          - int16
          - uint16
          - int8
          ops:
          - add
          - sub
          - adc
          - neg
          - abs
          - add_sat
          - mul
          - mul_high
          - min
          - max
          - cmp
          - shl
          - shr_arith
          - rol
          - and
          - or
          - xor
          - not
          - popcount
          - clz
          - ctz
          choices:
          - family: residue
            modulus: 15
            generator_style: csa_tree
            comparator.family: direct_compare
    clock_ps:
      fixed: 300
    rounding:
      fixed: RNE
    daz_in:
      fixed: false
    ftz_out:
      fixed: false
    flags:
      fixed:
      - carry
      - int_overflow
    sr_bits:
      fixed: 8
    unary_dual:
      fixed: false
    check_sr:
      fixed: true
    nan_payload:
      fixed: canonical
    invalid_result:
      fixed: saturate
    nan_to_int:
      fixed: zero
    minmax_nan:
      fixed: propagate
    tininess:
      fixed: after
    int_div_zero:
      fixed: riscv
    zero_sign:
      fixed: positive
    quire_overflow:
      fixed: wrap
    block_scale_rounding:
      fixed: nearest
    block_element_overflow:
      fixed: saturate
    sr_compare:
      fixed: gt
    flag_scope:
      fixed: per_result
    check_flags:
      fixed: false
    verify.n_random:
      fixed: 300
    verify.seed:
      fixed: 655366
    verify.n_random_masks:
      fixed: 2000
    core.family:
      fixed: unit_per_class
    core.*:
      search: all
    core.subword.family:
      search:
      - partitioned_carry_chain
      - replicated_lanes
  artifacts:
    core:
      role: seed
      kind: text
      source: generated
      language: systemverilog
      indexed_by: rtl_members
      declaration_member: top
      evolve:
      - alu_core
      - alu_core_u_*
    checker:
      role: fixed
      kind: text
      source: generated
      language: systemverilog
    verify_bundle:
      role: fixed
      kind: text
      source: generated
      indexed_by: verify_files
  evaluate:
    nodes:
      declaration:
        node: adir.declaration
      lint:
        node: chialu.eda.lint
        inputs:
          rtl_text: candidate.core
      conformance:
        node: chialu.eda.conformance
        inputs:
          rtl_text: candidate.core
          files: artifacts.verify_bundle
      checker_gen:
        node: chialu.eda.checker_gen
        inputs:
          files: artifacts.verify_bundle
          decl: decl.check
      fault:
        node: chialu.eda.fault
        inputs:
          rtl_text: candidate.core
          files: artifacts.verify_bundle
          checker_rtl: checker_gen.rtl_text
      yosys_stat:
        node: chialu.eda.yosys_stat
        inputs:
          rtl_text: candidate.core
          top: alu_core
      synth_unit:
        node: chialu.eda.synth_unit
        inputs:
          repeats: 5
          rtl_text: candidate.core
          structures: decl.STRUCTURE
          pdk: nangate45
          clock_ps: vars.clock_ps
          effort: medium
        when:
        - conformance.pass
        - yosys_stat.cells le 2.0 * seed.yosys_stat.cells
      synth_ppa:
        node: chialu.eda.synth_ppa
        inputs:
          repeats: 5
          rtl_text: candidate.core
          top: alu_core
          pdk: nangate45
          clock_ps: vars.clock_ps
          effort: medium
          timeout_s: 1200
        when:
        - conformance.pass
        - synth_unit.area_um2 le 1.2 * seed.synth_unit.area_um2
    feedback:
    - conformance.detail
    - checker_gen.detail
    - fault.detail
    - synth_unit.attribution
    - synth_ppa.detail
    - synth_ppa.summary
    - synth_ppa.critical_path
    - synth_ppa.paths
    - synth_ppa.area_by_hierarchy
  constraints:
  - metric: declaration.ok
    eq: true
    hard: true
  - metric: lint.ok
    eq: true
    hard: true
  - metric: conformance.pass
    eq: true
    hard: true
  - metric: fault.pass
    eq: true
    hard: true
  - metric: fault.alias_rate
    le: 0.09
    hard: true
  - metric: fault.escape_max
    le: 0.05
    hard: true
  goal:
    pareto:
    - minimize: synth_ppa.area_um2
    - minimize: synth_ppa.abc_delay_ps
    score:
      rule: ratio_to_seed
      infeasible: slack
  knowledge: ../chialu/knowledge
  role:
    file: ../targets/prompts/role.md
  task:
    script: ../chialu/task.py
  search:
    backend: adaevolve
    iterations: 20
    parallel: 2
    parallel_nodes: 6
    eval_timeout_s: 3600
    diff_mode: true
    max_solution_bytes: 400000
    retries: 1
    database:
      use_migration: true
      migration_interval: 10
      use_paradigm_breakthrough: true
      diversity_strategy: metric
    seeds:
      generated: []
      discover: 0
    context:
      programs: 1
    prompts:
      variants:
        operator:
        - structural
        - local
        - free
        ambition:
        - conservative
        - moderate
        - aggressive
        member_focus:
        - one
        feedback_depth:
        - files
        knowledge_depth:
        - path
      sample: ucb
      sources:
      - chialu_interface
      - chialu_families
      - chialu_structures
      - chialu_timing
      log: true
    tactics:
      sources: []
      select: ucb
      window: 20
    models:
      solution:
        agent: opencode
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
        effort: high
        max_output_tokens: 943718
        timeout_s: 1200
        retries: 2
      guide:
        agent: opencode
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
        effort: high
        max_output_tokens: 943718
        timeout_s: 1200
        retries: 2
    budget:
      wall_hours: 12
      node_runs: 2000
      llm_calls: 200
    history:
      entries: 7
    extensions:
      calibration:
        model: xgboost             # gnn selects the packaged whole-design graph model
        min_delay_gap_pct: 5       # smaller true differences are synthesis noise
        min_area_gap_pct: 2
        gnn:
          config: G5              # G1..G8, or full experiment names; G5 omits estimate globals
          hyperparameters: {}     # optional architecture/optimizer overrides
          ensemble_size: 3
          epochs: 250
          patience: 40
          device: cpu             # cuda for a configured GPU worker
          python: python          # interpreter with numpy and torch
          host: null              # optional SSH host, e.g. <host>
          workdir: null           # required remote scratch directory when host is set
          threads: 2
        exhaustive_below: 2000
        ranking:
          metric: delay
          target_rho: 0.9
          margin: 0.03
          confidence: 0.99
          rows_per_column: 10
          test_size: null
          initial_train: null
          increment: null
          max_rounds: 6
    stop:
      plateau_iterations: 30
  archive:
    store: jsonl
    path: results_db.jsonl
    keep_transcripts: true
    report:
      front_only: false
