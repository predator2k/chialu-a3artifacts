# The numeric stage of fp_alu_cmp (docs/demo-plan.md, stage 2): NSGA-II or SMAC over the
# declared families and choices, scored by the synthesis database's estimate; its front
# becomes seeds of the search run (chialu.front_seeds). Written by targets/make_targets.py.

# ---- ADIR instance (read by `adir`) -----------------------------------
adir:
  module: chialu.ALU
  run_dir: run/fp_alu_cmp.numeric

  variables:
    modes:                             # a mode port over the formats
      runtime:
        - {count: 1, format: fp16}
        - {count: 1, format: bf16}
        - {count: 2, format: fp8e5m2}
    ops:                               # an opcode port over the ops
      runtime: [fadd, fsub, fmul, fmin, fmax, fcmp]
    accuracy:
      fixed: exact
    check_en:                          # no concurrent checker beside the datapath
      fixed: false
    clock_ps:                          # the synthesis target, below any design's reach: every synthesis maps for its least delay (MIN_DELAY_PS)
      fixed: 300
    rounding:
      runtime: [RNE, RTZ, RDN, RUP]
    daz_in:
      fixed: false
    ftz_out:
      fixed: false
    flags:                             # the flag bits the unit reports
      fixed: [invalid, overflow, underflow, inexact]
    sr_bits:
      fixed: 8
    unary_dual:                        # a unary op on both operands at once
      fixed: false
    check_sr:
      fixed: true
    nan_payload:
      fixed: canonical
    invalid_result:
      fixed: saturate
    nan_to_int:
      fixed: zero
    minmax_nan:
      fixed: number
    tininess:
      fixed: after
    int_div_zero:
      fixed: riscv
    zero_sign:
      fixed: positive
    quire_overflow:
      fixed: wrap
    block_scale_rounding:
      fixed: nearest
    block_element_overflow:
      fixed: saturate
    sr_compare:
      fixed: gt
    flag_scope:                        # one flag word per result, or one for the whole operation
      fixed: per_operation
    check_flags:
      fixed: false
    verify.n_random:                   # random vectors of the conformance testbench
      fixed: 20000
    verify.seed:
      fixed: 655366
    x_form:                            # internal float representation; exact preserves the baseline
      search: all
    core.family:                       # the core's architecture: one unit per op class, its structures shared by plan
      fixed: unit_per_class
    core.*:                            # every structure family and choice; undeclared ones stand at their defaults
      search: all
    search_geometry:                   # sample components at the independent mode widths
      fixed: independent_modes
    core.rounder.*.family:             # cross-format sharing is selected by the plan
      search: [dedicated_per_op, shared_per_lane]
    core.unpacker.*.family:            # cross-format sharing is selected by the plan
      search: [per_unit_unpack, shared_per_lane]
    core.fp_multiplier.*.family:       # an internally rounded multiplier cannot serve cross-format arithmetic sharing
      search: [sig_mul_then_round]
    core.fp_fma.*.sharing:             # cross-format FMA sharing requires coordinated per-mode selections
      search: [dedicated_per_mode]

  artifacts:
    verify_bundle:                       # the spec the estimate reads its structure manifest from
      role: fixed
      kind: text
      source: generated
      indexed_by: verify_files

  evaluate:
    nodes:
      declaration:
        node: adir.declaration
      estimate:                          # the synthesis database's area and delay of the declared structures
        node: chialu.eda.estimate
        inputs:
          files: artifacts.verify_bundle
          decl: decl.core
          pdk: nangate45
          effort: medium
          area_scale: 1.0                # the pipeline's calibrate stage writes the baseline's measured/estimated
          delay_scale: 1.0               # ratios into <name>.numeric.cal.yaml
          glue_json: ""                  # and the glue the top adds around the structures (the OR of a mode's
                                         # unit buses, the mode mux, the flags), which no row of a module alone has
          context_json: ""               # and the factor a (kind, family) costs in place against its row, from
                                         # the same profile: a unit overlapping its producer is cheaper than alone
    feedback: [estimate.detail]

  constraints:
    - {metric: declaration.ok, eq: true, hard: true}
    - {metric: estimate.ok, eq: true, hard: true}
    - {metric: estimate.coverage, ge: 0.8}          # a declaration the database mostly lacks is not ranked

  goal:
    pareto:                              # the front over the estimated area and delay
      - minimize: estimate.area_um2
      - minimize: estimate.delay_ps
    score:
      rule: ratio_to_seed
      infeasible: slack

  knowledge: ../../chialu/knowledge
  role:
    file: ../../targets/prompts/role.md   # who the model is: the system text's first section
  task:
    script: ../../chialu/task.py          # the task statement, rendered from the bound unit

  search:
    backend: nsga2                       # the database-driven stage (docs/demo-plan.md); smac by --backend
    iterations: 400
    numeric:
      seed: 1
    seeds:
      generated: [baseline, packed_banks, per_position, dedicated_speed]   # the initial designs' declarations
    stop:
      plateau_iterations: 120

  archive:
    store: jsonl
    path: results_db.jsonl
    report:
      front_only: false
