adir:
  module: chialu.ALU
  run_dir: run/fp_alu_cmp.numeric
  variables:
    modes:
      runtime:
      - count: 1
        format: fp16
      - count: 1
        format: bf16
      - count: 2
        format: fp8e5m2
    ops:
      runtime:
      - fadd
      - fsub
      - fmul
      - fmin
      - fmax
      - fcmp
    accuracy:
      fixed: exact
    check_en:
      fixed: false
    clock_ps:
      fixed: 300
    rounding:
      runtime:
      - RNE
      - RTZ
      - RDN
      - RUP
    daz_in:
      fixed: false
    ftz_out:
      fixed: false
    flags:
      fixed:
      - invalid
      - overflow
      - underflow
      - inexact
    sr_bits:
      fixed: 8
    unary_dual:
      fixed: false
    check_sr:
      fixed: true
    nan_payload:
      fixed: canonical
    invalid_result:
      fixed: saturate
    nan_to_int:
      fixed: zero
    minmax_nan:
      fixed: number
    tininess:
      fixed: after
    int_div_zero:
      fixed: riscv
    zero_sign:
      fixed: positive
    quire_overflow:
      fixed: wrap
    block_scale_rounding:
      fixed: nearest
    block_element_overflow:
      fixed: saturate
    sr_compare:
      fixed: gt
    flag_scope:
      fixed: per_operation
    check_flags:
      fixed: false
    verify.n_random:
      fixed: 300
    verify.seed:
      fixed: 655366
    x_form:
      search: all
    core.family:
      fixed: unit_per_class
    core.*:
      search: all
  artifacts:
    verify_bundle:
      role: fixed
      kind: text
      source: generated
      indexed_by: verify_files
  evaluate:
    nodes:
      declaration:
        node: adir.declaration
      estimate:
        node: chialu.eda.estimate
        inputs:
          files: artifacts.verify_bundle
          decl: decl.core
          pdk: nangate45
          effort: medium
          area_scale: 0.6284
          delay_scale: 1.0514
          glue_json: '{"mode": {"0": 96.2, "1": 0.0, "2": 0.0}, "top": 273.4}'
          context_json: '{"fp_adder/single_path": 0.6704, "unpacker/per_unit_unpack": 0.9551, "rounder/dedicated_per_op": 0.6444, "fp_multiplier/sig_mul_then_round": 0.4609, "fp_comparator/integer_compare_on_bits":
            0.5522}'
          plan_json: '{"shared": {}, "structures": {}, "why": "sharing scheme add-none_mul-none_log-none_pair-none_fmt-none: adders none, multipliers none, gate rows none, adder partner none, float sharing
            none"}'
    feedback:
    - estimate.detail
  constraints:
  - metric: declaration.ok
    eq: true
    hard: true
  - metric: estimate.ok
    eq: true
    hard: true
  - metric: estimate.coverage
    ge: 0.8
  goal:
    pareto:
    - minimize: estimate.area_um2
    - minimize: estimate.delay_ps
    score:
      rule: ratio_to_seed
      infeasible: slack
  knowledge: ../../chialu/knowledge
  role:
    file: ../../targets/prompts/role.md
  task:
    script: ../../chialu/task.py
  search:
    backend: nsga2
    iterations: 400
    numeric:
      seed: 1
    seeds:
      generated:
      - baseline
      - packed_banks
      - per_position
      - dedicated_speed
    stop:
      plateau_iterations: 120
  archive:
    store: jsonl
    path: results_db.jsonl
    report:
      front_only: false
