  artifacts:
    core:
      role: seed
      kind: text
      source: generated
      language: systemverilog
      indexed_by: rtl_members
      declaration_member: top
      evolve:
      - alu_core
      - alu_core_u_*
    verify_bundle:
      role: fixed
      kind: text
      source: generated
      indexed_by: verify_files
  evaluate:
    nodes:
      declaration:
        node: adir.declaration
      lint:
        node: chialu.eda.lint
        inputs:
          rtl_text: candidate.core
      conformance:
        node: chialu.eda.conformance
        inputs:
          rtl_text: candidate.core
          files: artifacts.verify_bundle
      review:
        node: chialu.review.opencode
        inputs:
          rtl_text: candidate.core
          structures: decl.STRUCTURE
          declaration: decl.core
          provider: '''openrouter'''
          model: '''deepseek/deepseek-v4.1-flash'''
          timeout_s: 900
          effort: high
          max_output_tokens: 943718
          only: candidate.touched
        when:
        - conformance.pass
      yosys_stat:
        node: chialu.eda.yosys_stat
        inputs:
          rtl_text: candidate.core
          top: alu_core
      synth_unit:
        node: chialu.eda.synth_unit
        inputs:
          repeats: 5
          rtl_text: candidate.core
          structures: decl.STRUCTURE
          pdk: nangate45
          clock_ps: vars.clock_ps
          effort: medium
        when:
        - conformance.pass
        - yosys_stat.cells le 2.0 * seed.yosys_stat.cells
      synth_ppa:
        node: chialu.eda.synth_ppa
        inputs:
          repeats: 5
          rtl_text: candidate.core
          top: alu_core
          pdk: nangate45
          clock_ps: vars.clock_ps
          effort: medium
          timeout_s: 1200
        when:
        - conformance.pass
        - synth_unit.area_um2 le 1.2 * seed.synth_unit.area_um2
    feedback:
    - conformance.detail
    - review.detail
    - synth_unit.attribution
    - synth_ppa.detail
    - synth_ppa.summary
    - synth_ppa.critical_path
    - synth_ppa.paths
    - synth_ppa.area_by_hierarchy
  constraints:
  - metric: declaration.ok
    eq: true
    hard: true
  - metric: lint.ok
    eq: true
    hard: true
  - metric: conformance.pass
    eq: true
    hard: true
  - metric: review.dissent
    le: 1
  goal:
    pareto:
    - minimize: synth_ppa.area_um2
    - minimize: synth_ppa.abc_delay_ps
    score:
      rule: ratio_to_seed
      infeasible: slack
  knowledge: $A3EVAL/3rdparty/chialu/chialu/knowledge
  role:
    file: $A3EVAL/3rdparty/chialu/targets/prompts/role.md
  task:
    script: $A3EVAL/3rdparty/chialu/chialu/task.py
  search:
    backend: adaevolve
    iterations: 20
    parallel: 2
    parallel_nodes: 6
    eval_timeout_s: 3600
    diff_mode: true
    max_solution_bytes: 400000
    retries: 1
    database:
      use_migration: true
      migration_interval: 10
      use_paradigm_breakthrough: true
      diversity_strategy: metric
    seeds:
      generated: [baseline]              # the database's fastest family at every structure (chialu.prune --best delay)
    context:
      programs: 1
    prompts:
      variants:
        operator:
        - structural
        - local
        - free
        ambition:
        - conservative
        - moderate
        - aggressive
        member_focus:
        - one
        feedback_depth:
        - files
        knowledge_depth:
        - path
      sample: ucb
      sources:
      - chialu_interface
      - chialu_families
      - chialu_structures
      - chialu_timing
      log: true
    tactics:
      sources: []
      select: ucb
      window: 20
    models:
      solution:
        agent: opencode
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
        effort: high
        max_output_tokens: 943718
        timeout_s: 1200
        retries: 2
      guide:
        agent: opencode
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
        effort: high
        max_output_tokens: 943718
        timeout_s: 1200
        retries: 2
    budget:
      wall_hours: 12
      node_runs: 2000
      llm_calls: 200
    history:
      entries: 7
    extensions:
      calibration:
        model: xgboost             # gnn selects the packaged whole-design graph model
        min_delay_gap_pct: 5       # smaller true differences are synthesis noise
        min_area_gap_pct: 2
        gnn:
          config: G5              # G1..G8, or full experiment names; G5 omits estimate globals
          hyperparameters: {}     # optional architecture/optimizer overrides
          ensemble_size: 3
          epochs: 250
          patience: 40
          device: cpu             # cuda for a configured GPU worker
          python: python          # interpreter with numpy and torch
          host: null              # optional SSH host, e.g. <host>
          workdir: null           # required remote scratch directory when host is set
          threads: 2
        exhaustive_below: 2000
        ranking:
          metric: delay
          target_rho: 0.9
          margin: 0.03
          confidence: 0.99
          rows_per_column: 10
          test_size: null
          initial_train: null
          increment: null
          max_rounds: 6
    stop:
      plateau_iterations: 30
  archive:
    store: jsonl
    path: results_db.jsonl
    keep_transcripts: true
    report:
      front_only: false
