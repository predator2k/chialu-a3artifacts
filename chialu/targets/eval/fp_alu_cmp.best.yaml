# The no-model reference of fp_alu_cmp: chialu.prune --best delay fixes every structure to the synthesis
# database's fastest family at its width, with the pins of the row that won; `adir seeds` measures it.
# the database's best structures of targets/eval/fp_alu_cmp.yaml by delay, written by chialu.prune on nangate45; comments of the source file are not carried over
cluster_name: fp_alu_cmp
provider:
  head_ip: ${THIS_MACHINE}
auth:
  ssh_user: ${USER}
  overrides:
    <IP>:
      tunnel:
        gcs_tunnel_port: 6395
        head_worker_port_min: 21000
        head_worker_port_max: 21399
        ray_worker_port_min: 30000
        ray_worker_port_max: 30199
        pre_tunnel_commands:
        - bash $REMOTE_HOME/chialu-home/start_relay.sh
available_node_types:
  eda:
    resources:
      eda: 124
      opencode_creds: 100
    num_workers: 1
    compatible_ips:
    - ${THIS_MACHINE}
    worker_env_commands:
    - source $CHIALU_HOME/chialu-env.sh
    - export RAY_num_workers_soft_limit=150
    - export VERTEX_LOCATION=global
  eda_<host>:
    resources:
      eda: 84
      opencode_creds: 0
    num_workers: 1
    compatible_ips:
    - ${<host>_MACHINE}
    worker_env_commands:
    - source $REMOTE_HOME/chialu-home/chialu-env.sh
head_env_commands:
- source $CHIALU_HOME/chialu-env.sh
- export VERTEX_LOCATION=global
- export RAY_num_workers_soft_limit=150
head_start_ray_commands:
- ray stop
- ray start --head --port=${CHIA_RAY_PORT} --include-dashboard=false --dashboard-agent-listen-port=0
worker_start_ray_commands:
- ray stop
- ray start --address=$RAY_HEAD_IP:${CHIA_RAY_PORT} --dashboard-agent-listen-port=0
cache:
  conformance:
    cache: true
  fault:
    cache: true
  synth_unit:
    cache: true
  synth_ppa:
    cache: true
adir:
  module: chialu.ALU
  run_dir: run/fp_alu_cmp.best
  variables:
    modes:
      runtime:
      - count: 1
        format: fp16
      - count: 1
        format: bf16
      - count: 2
        format: fp8e5m2
    ops:
      runtime:
      - fadd
      - fsub
      - fmul
      - fmin
      - fmax
      - fcmp
    accuracy:
      fixed: exact
    check_en:
      fixed: false
    clock_ps:
      fixed: 300
    rounding:
      runtime:
      - RNE
      - RTZ
      - RDN
      - RUP
    daz_in:
      fixed: false
    ftz_out:
      fixed: false
    flags:
      fixed:
      - invalid
      - overflow
      - underflow
      - inexact
    sr_bits:
      fixed: 8
    unary_dual:
      fixed: false
    check_sr:
      fixed: true
    nan_payload:
      fixed: canonical
    invalid_result:
      fixed: saturate
    nan_to_int:
      fixed: zero
    minmax_nan:
      fixed: number
    tininess:
      fixed: after
    int_div_zero:
      fixed: riscv
    zero_sign:
      fixed: positive
    quire_overflow:
      fixed: wrap
    block_scale_rounding:
      fixed: nearest
    block_element_overflow:
      fixed: saturate
    sr_compare:
      fixed: gt
    flag_scope:
      fixed: per_operation
    check_flags:
      fixed: false
    verify.n_random:
      fixed: 300
    verify.seed:
      fixed: 655366
    core.family:
      fixed: unit_per_class
    core.*:
      search: all
    core.fp_adder.m0.family:
