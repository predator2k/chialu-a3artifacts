# The comparison target of docs/evaluation-plan.md (section 2): fp16, bf16
# and 2 x fp8e5m2 modes on a 16-bit datapath with add, sub, mul, min, max
# and compare, the four IEEE rounding modes at run time, min/max as
# minimumNumber/maximumNumber, the four flags, no checker; the Pareto
# front of area and delay at the clock target. The reference designs
# (FPnew first) present the same interface through their wrappers.
# Every model call is opencode on deepseek/deepseek-v4.1-flash through openrouter; every prompt
# and reply is logged under the run directory. Written by targets/make_targets.py.

# ---- CHIA cluster (read by `chia up`) ---------------------------------
# Two machines are registered: <host> (the head, also an EDA worker) and
# <host>.  Neither shares a filesystem with the other, so each node type
# sources its own environment file; those files move HOME onto the large
# volume (/data2 on <host>, /mnt/ssd on <host>) so that nothing this
# cluster runs writes to a home quota or to /tmp.
cluster_name: fp_alu_cmp

provider:
  head_ip: ${THIS_MACHINE}

auth:
  ssh_user: ${USER}
  overrides:
    <IP>:                        # <host>; a literal IP, chia expands ${VAR} in values only
      tunnel:                            # <host>'s and <host>'s firewalls pass only port 22, so Ray rides an SSH tunnel
        gcs_tunnel_port: 6395            # the worker dials $RAY_HEAD_IP:<this>, so it must equal the head port above
        # chia pins the HEAD's ray worker ports as soon as any worker is tunnelled, and its
        # default range is 100 wide.  Ray keeps idle workers alive, so on a 344-CPU cluster the
        # range runs out and every later driver hangs in cache.start_cache() with no error.
        # The range is also bounded from above: chia reverse-tunnels every one of these ports,
        # each listener costs two sockets (v4 and v6) on <host>, and <host>'s sshd hands sessions
        # RLIMIT_NOFILE=1024 -- the forward fails at offset 483 every time, and
        # ExitOnForwardFailure then kills the whole tunnel.  chia's default fix for this raises
        # sshd's LimitNOFILE, which needs root we do not have, so the range stays under ~450.
        # It sits below the ephemeral range (32768-60999) as well, so an outgoing connection on
        # <host> cannot transiently steal one of these ports.
        head_worker_port_min: 21000
        head_worker_port_max: 21399
        # The worker's range does cost: chia emits one ssh -L per port.  200 is far more than
        # <host>'s 84 eda slots can occupy and still keeps the ssh command manageable.
        ray_worker_port_min: 30000
        ray_worker_port_max: 30199
        pre_tunnel_commands:             # chia's default here needs sudo; we have no root on either machine
          - bash $REMOTE_HOME/chialu-home/start_relay.sh

available_node_types:
  eda:                                   # <host>: verilator, yosys, ABC; the opencode login
    resources:
      eda: 124                           # tool slots: a simulation node takes CHIALU_VERILATOR_JOBS of them, a synthesis one CHIALU_EDA_SYNTH_WEIGHT
      opencode_creds: 100                 # concurrent agent calls; one per run in flight, so this bounds how many runs share the host
    num_workers: 1
    compatible_ips: ["${THIS_MACHINE}"]
    worker_env_commands:
      - source $CHIALU_HOME/chialu-env.sh
      - export RAY_num_workers_soft_limit=150
      - export VERTEX_LOCATION=global       # only the google-vertex provider reads it; harmless otherwise
  eda_<host>:                             # <host>: EDA only, no agent calls (no credentials staged there)
    resources:
      eda: 84
      opencode_creds: 0
    num_workers: 1
    compatible_ips: ["${<host>_MACHINE}"]
    worker_env_commands:
      - source $REMOTE_HOME/chialu-home/chialu-env.sh

head_env_commands:
  - source $CHIALU_HOME/chialu-env.sh
  - export VERTEX_LOCATION=global
  - export RAY_num_workers_soft_limit=150   # ray keeps one idle worker per CPU by default; on 344
                                            # CPUs that outruns the pinned worker-port range above

head_start_ray_commands:
  - ray stop
  - ray start --head --port=${CHIA_RAY_PORT} --include-dashboard=false --dashboard-agent-listen-port=0

worker_start_ray_commands:
  - ray stop
  - ray start --address=$RAY_HEAD_IP:${CHIA_RAY_PORT} --dashboard-agent-listen-port=0

cache:
  conformance:
    cache: true
  fault:
    cache: true
  synth_unit:
    cache: true
  synth_ppa:
    cache: true

# ---- ADIR instance (read by `adir`) -----------------------------------
adir:
  module: chialu.ALU
  run_dir: run/fp_alu_cmp_fpnew

  variables:
    modes:                             # a mode port over the formats
      runtime:
        - {count: 1, format: fp16}
        - {count: 1, format: bf16}
        - {count: 2, format: fp8e5m2}
    ops:                               # an opcode port over the ops
      runtime: [fadd, fsub, fmul, fmin, fmax, fcmp]
    accuracy:
      fixed: exact
    check_en:                          # no concurrent checker beside the datapath
      fixed: false
    clock_ps:                          # the synthesis target, below any design's reach: every synthesis maps for its least delay (MIN_DELAY_PS)
      fixed: 300
    rounding:
      runtime: [RNE, RTZ, RDN, RUP]
    daz_in:
      fixed: false
    ftz_out:
      fixed: false
    flags:                             # the flag bits the unit reports
      fixed: [invalid, overflow, underflow, inexact]
    sr_bits:
      fixed: 8
    x_form:                            # the raw form of the reference: p + 3 significand bits and a sticky, exp_bits + 3
      fixed: guard_round_sticky
    unary_dual:                        # a unary op on both operands at once
      fixed: false
    check_sr:
      fixed: true
    nan_payload:
      fixed: canonical
    invalid_result:
      fixed: saturate
    nan_to_int:
      fixed: zero
    minmax_nan:
      fixed: number
    tininess:
      fixed: after
    int_div_zero:
      fixed: riscv
    zero_sign:
      fixed: positive
    quire_overflow:
      fixed: wrap
    block_scale_rounding:
      fixed: nearest
    block_element_overflow:
      fixed: saturate
    sr_compare:
      fixed: gt
    flag_scope:                        # one flag word per result, or one for the whole operation
      fixed: per_operation
    check_flags:
      fixed: false
    verify.n_random:                   # random vectors of the conformance testbench
      fixed: 20000
    verify.seed:
      fixed: 655366
    core.family:                       # the core's architecture: one unit per op class, its structures shared by plan
      fixed: unit_per_class
    core.*:                            # every structure family and choice; undeclared ones stand at their defaults
      search: all
    # FPnew's ADDMUL and NONCOMP slices, slot by slot, per (mode, lane) structure. The ADDMUL slice is one
    # multi-format fpnew_fma serving fadd as 1 * a + b and fmul as a * b + 0: the fp_fma slot declares the
    # fused datapath, which closes the fp_adder and fp_multiplier slots of the mode, and shares it across the
    # formats (lane 0 for fp16, bf16 and fp8, lane 1 for the second fp8 element, as FPnew's MERGED lanes)
    core.fp_fma.m0.family:   # fpnew_fma: one fused datapath for fadd, fsub and fmul
      fixed: classic_fma
    core.fp_fma.m1.family:
      fixed: classic_fma
    core.fp_fma.m2.family:
      fixed: classic_fma
    core.fp_fma.m0.sharing:   # fpnew_fma_multi: one datapath for every format
      fixed: shared_across_formats
    core.fp_fma.m1.sharing:
      fixed: shared_across_formats
    core.fp_fma.m2.sharing:
      fixed: shared_across_formats
    core.fp_fma.m0.subnormal_representation:   # info_a.is_subnormal adjusts the exponent; no normalizer at entry
      fixed: as_stored
    core.fp_fma.m1.subnormal_representation:
      fixed: as_stored
    core.fp_fma.m2.subnormal_representation:
      fixed: as_stored
    core.fp_fma.m0.negation_handling:   # sum_pos and sum_neg in parallel, sum_carry selecting
      fixed: dual_adder
    core.fp_fma.m1.negation_handling:
      fixed: dual_adder
    core.fp_fma.m2.negation_handling:
      fixed: dual_adder
    core.fp_fma.m0.multiplier.family:   # mantissa_a * mantissa_b
      fixed: behavioral_star
    core.fp_fma.m1.multiplier.family:
      fixed: behavioral_star
    core.fp_fma.m2.multiplier.family:
      fixed: behavioral_star
    core.fp_fma.m0.align.family:
      fixed: full_align
    core.fp_fma.m1.align.family:
      fixed: full_align
    core.fp_fma.m2.align.family:
      fixed: full_align
    core.fp_fma.m0.align.sticky_method:   # sticky_before_add = (| addend_sticky_bits)
      fixed: or_tree_shifted_out
    core.fp_fma.m1.align.sticky_method:
      fixed: or_tree_shifted_out
    core.fp_fma.m2.align.sticky_method:
      fixed: or_tree_shifted_out
    core.fp_fma.m0.align.shifter.family:   # addend_shifted = addend >> addend_shamt
      fixed: barrel_mux_tree
    core.fp_fma.m1.align.shifter.family:
      fixed: barrel_mux_tree
    core.fp_fma.m2.align.shifter.family:
      fixed: barrel_mux_tree
    core.fp_fma.m0.lza.family:   # common_cells lzc on the sum
      fixed: lzc_after_add
    core.fp_fma.m1.lza.family:
      fixed: lzc_after_add
    core.fp_fma.m2.lza.family:
      fixed: lzc_after_add
    core.fp_fma.m0.lza.counter.family:
      fixed: lzd_cell_tree
    core.fp_fma.m1.lza.counter.family:
      fixed: lzd_cell_tree
    core.fp_fma.m2.lza.counter.family:
      fixed: lzd_cell_tree
    core.fp_fma.m0.norm_shifter.family:   # sum_shifted = sum_q << norm_shamt
      fixed: barrel_mux_tree
    core.fp_fma.m1.norm_shifter.family:
      fixed: barrel_mux_tree
    core.fp_fma.m2.norm_shifter.family:
      fixed: barrel_mux_tree
    # the window adder (sum_pos = product_shifted + addend_shifted + inject_carry_in) is written as the operator,
    # so its cpa slot stands at the default
    core.fp_comparator.m0.family:   # fpnew_noncomp: operand_a_smaller = (operand_a < operand_b) ^ (sign_a || sign_b), on the bit patterns
      fixed: integer_compare_on_bits
    core.fp_comparator.m1.family:
      fixed: integer_compare_on_bits
    core.fp_comparator.m2.family:
      fixed: integer_compare_on_bits
    core.unpacker.m0.family:   # one fpnew_classifier per operand and format
      fixed: per_unit_unpack
    core.unpacker.m1.family:
      fixed: per_unit_unpack
    core.unpacker.m2.family:
      fixed: per_unit_unpack
    core.unpacker.m0.denormal_handling:   # the classifier flags a subnormal; nothing normalizes it
      fixed: in_datapath
    core.unpacker.m1.denormal_handling:
      fixed: in_datapath
    core.unpacker.m2.denormal_handling:
      fixed: in_datapath
    core.rounder.m0.family:
      fixed: shared_across_formats
    core.rounder.m1.family:
      fixed: shared_across_formats
    core.rounder.m2.family:
      fixed: shared_across_formats
    core.rounder.m0.round.family:
      fixed: increment_adder
    core.rounder.m1.round.family:
      fixed: increment_adder
    core.rounder.m2.round.family:
      fixed: increment_adder
    core.rounder.m0.lzc.family:
      fixed: lzd_cell_tree
    core.rounder.m1.lzc.family:
      fixed: lzd_cell_tree
    core.rounder.m2.lzc.family:
      fixed: lzd_cell_tree
    core.rounder.m0.shifter.family:
      fixed: barrel_mux_tree
    core.rounder.m1.shifter.family:
      fixed: barrel_mux_tree
    core.rounder.m2.shifter.family:
      fixed: barrel_mux_tree

  artifacts:
    core:
      role: seed
      kind: text
      source: generated
      language: systemverilog
      indexed_by: rtl_members           # one member (file) per structure, plus packages, top and library
      declaration_member: top            # the VAR / STRUCTURE block sits in the top's region
      evolve: [alu_core, "alu_core_u_*"]  # the top and every unit module: one region each
    verify_bundle:
      role: fixed
      kind: text
      source: generated
      indexed_by: verify_files

  evaluate:
    nodes:
      declaration:
        node: adir.declaration
      lint:
        node: chialu.eda.lint
        inputs:
          rtl_text: candidate.core
      conformance:
        node: chialu.eda.conformance
        inputs:
          rtl_text: candidate.core
          files: artifacts.verify_bundle
      review:                            # a coding agent reads the modules the candidate wrote itself: does the text realize the declared family?
        node: chialu.review.opencode       # opencode | claude | codex; the node takes that agent's worker credential
        inputs:
          rtl_text: candidate.core
          structures: decl.STRUCTURE
          declaration: decl.core           # the completed declaration: a structure at its slot's default family is reviewed too
          provider: "'openrouter'"
          model: "'deepseek/deepseek-v4.1-flash'"
          timeout_s: 900
          effort: high
          max_output_tokens: 943718   # deepseek-v4.1-flash output limit on openrouter: opencode asks for all of it
          only: candidate.touched          # the members whose text differs from the parent's; a re-rendered unit needs no review
          work_dir: run.agent_dir           # the review calls' directories (prompt, files, transcript) beside the solution calls'
        when:
          - conformance.pass
      yosys_stat:                        # a gate count after techmap: the screen before synthesis
        node: chialu.eda.yosys_stat
        inputs:
          rtl_text: candidate.core
          top: alu_core
      synth_unit:                        # ABC map of every unit module alone: the attribution per structure
        node: chialu.eda.synth_unit
        inputs:
          repeats: 5
          rtl_text: candidate.core
          structures: decl.STRUCTURE
          pdk: nangate45
          clock_ps: vars.clock_ps
          effort: medium
        when:
          - conformance.pass
          - yosys_stat.cells le 2.0 * seed.yosys_stat.cells
      synth_ppa:
        node: chialu.eda.synth_ppa
        inputs:
          repeats: 5
          rtl_text: candidate.core
          top: alu_core
          pdk: nangate45
          clock_ps: vars.clock_ps
          effort: medium                 # as every other run file (the frozen tables and the search targets)
          timeout_s: 1200
          report: true                   # the critical path, paths and area by hierarchy as feedback, whatever CHIALU_SYNTH_REPORT says
        when:
          - conformance.pass
          - synth_unit.area_um2 le 1.2 * seed.synth_unit.area_um2
    feedback: [conformance.detail, review.detail, synth_unit.attribution, synth_ppa.detail, synth_ppa.summary, synth_ppa.critical_path, synth_ppa.paths, synth_ppa.area_by_hierarchy]

  constraints:
    - {metric: declaration.ok, eq: true, hard: true}
    - {metric: lint.ok, eq: true, hard: true}
    - {metric: conformance.pass, eq: true, hard: true}
    - {metric: review.dissent, le: 1}           # modules whose text does not realize the family they declare;
                                               # one is tolerated because a rewrite often lands on a structure the
                                               # declaration no longer names, two says the declaration is fiction.
                                               # A count, not a ratio: it means the same for two structures or twelve,
                                               # and a review whose call failed reports no dissent rather than total dissent.

  goal:
    pareto:                              # the front over area and delay of the delay-driven mapping
      - minimize: synth_ppa.area_um2
      - minimize: synth_ppa.abc_delay_ps
    score:
      rule: ratio_to_seed
      infeasible: slack

  knowledge: ../../chialu/knowledge
  role:
    file: ../../targets/prompts/role.md   # who the model is: the system text's first section
  task:
    script: ../../chialu/task.py          # the task statement, rendered from the bound unit

  search:
    backend: adaevolve
    iterations: 20
    parallel: 2
    parallel_nodes: 6
    eval_timeout_s: 3600
    diff_mode: true
    max_solution_bytes: 400000
    attempts: 1                          # one candidate per iteration for every backend (no re-prompt on a failed one)
    retries: 0
    database:
      use_migration: true
      migration_interval: 10
      use_paradigm_breakthrough: true
      diversity_strategy: metric
    seeds:
      generated: [baseline]              # the score reference; the numeric stage's front adds the rest
      rank:
        prior: chialu_structure_area
        top: 8
    context:
      programs: 1                        # the program reaches the agent as a file path in the call's directory
    prompts:
      variants:
        operator: [structural, local, free]
        ambition: [conservative, moderate, aggressive]   # how far one round's change reaches; sampled like the rest
        member_focus: [one]              # one region per round
        feedback_depth: [files]          # every feedback artifact as a file of the call directory, indexed in the prompt
        knowledge_depth: [path]          # the directory's layout in one line; the agent lists it and reads the cards it needs
      sample: ucb
      sources: [chialu_interface, chialu_families, chialu_structures, chialu_timing]
      log: true
    tactics:
      sources: []
      select: ucb
      window: 20
    models:
      solution:
        agent: opencode
        provider: openrouter               # opencode's provider id; the model id is the provider's own
        model: deepseek/deepseek-v4.1-flash
        effort: high               # opencode passes it as --variant, the provider's reasoning effort
        max_output_tokens: 943718   # deepseek-v4.1-flash output limit on openrouter: opencode asks for all of it
        timeout_s: 1200                # one attempt, as the plain loop's call: a stalled call is recorded, not repeated
        retries: 1
      guide:
        agent: opencode
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash
        effort: high
        max_output_tokens: 943718   # deepseek-v4.1-flash output limit on openrouter: opencode asks for all of it
        timeout_s: 1200                # one attempt, as the plain loop's call: a stalled call is recorded, not repeated
        retries: 1
    budget:
      wall_hours: 12
      node_runs: 2000
      llm_calls: 200
    history:
      entries: 7                         # entries of a region's history the prompt summarizes
    stop:
      plateau_iterations: 0              # off: every method runs its full iteration count (the plain loop has no such stop)

  archive:
    store: jsonl
    path: results_db.jsonl
    keep_transcripts: true
    report:
      front_only: false
