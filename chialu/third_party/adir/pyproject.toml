[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adir"
version = "0.1.0"
description = "The task layer of an agentic hardware-design search: variables with binding times, an evaluation graph over CHIA nodes, constraints and a goal over node outputs, and the binding to a search backend."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
adir = "adir.cli:main"

[tool.setuptools.packages.find]
include = ["adir*"]
