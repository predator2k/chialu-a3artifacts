# The design space around the CacheFlex kernels: an L2 whose ways
# convert individually to scratchpad (the geometry is searched), the
# kernel family of cacheflex_kernel (text, searched), and a partition
# decided after deployment (a provisioned set, exercised by an oracle in
# this file). The evaluator is layered: a kernel is measured as a curve
# over capacity once per kernel text, the co-runners once per run, and
# the partition is a node over curves. Three fidelity levels, promoted
# by archive quantiles. The chiacache library and the gem5 nodes are
# named as the task needs them; none ships with chiALU.

# ---- CHIA cluster (read by `chia up`) ---------------------------------
cluster_name: cacheflex_dse

provider:
  head_ip: ${THIS_MACHINE}

auth:
  ssh_user: ${USER}

available_node_types:
  build:
    resources:
      build: 2
    num_workers: 1
    compatible_ips: ["${THIS_MACHINE}"]
    docker:
      image: chiacache-toolchain:latest
  sim:                                   # kernel-level gem5
    resources:
      sim: 1
    num_workers: 8
    compatible_ips: ["${THIS_MACHINE}"]
    docker:
      image: chiacache-gem5:latest
  sim_fs:                                # full-system gem5
    resources:
      sim_fs: 1
    num_workers: 2
    compatible_ips: ["${THIS_MACHINE}"]
    docker:
      image: chiacache-gem5:latest
  codex:
    resources:
      codex_creds: 4
    num_workers: 1
    compatible_ips: ["${THIS_MACHINE}"]
    docker:
      image: chialu-codex:latest
      run_options:
        - -v ${CODEX_HOME}:/root/.codex:ro
  evolver:
    resources:
      evolver: 1
    num_workers: 1
    compatible_ips: ["${THIS_MACHINE}"]

cache:
  build:
    cache: true
  gem5_kernel:
    cache: true
  gem5_fs:
    cache: true
  mrc:
    cache: true

# ---- ADIR instance (read by `adir`) -----------------------------------
adir:
  module: chiacache.CacheFlexCore
  run_dir: run/cacheflex_dse

  variables:
    l2.size_kb:
      search: [512, 1024, 2048]
    l2.ways:
      search: {min: 8, max: 16, step: 4}
    l2.line_bytes:
      fixed: 64
    l2.sp_granularity:
      fixed: way
    l2.sp_ways:                          # every way carries conversion logic; which are converted is decided after deployment
      runtime: all
    sp.banks:
      search: [4, 8]
    isa.ext:
      fixed: cflex_v1
    kernel.dtype:
      fixed: fp16
    mix:                                 # a library object: co-runner traces (bg) and weights
      fixed: mobile_a

  artifacts:
    kernels:                             # one kernel per shape class; VAR lines in gemm_small
      role: seed
      kind: text
      source: generated
      language: c
      members: [gemm_small, gemm_large, attn_s512, attn_s2048]
      declaration_member: gemm_small
      evolve: [kernel]
    policy:                              # the partition rule; read only when partition.select is policy
      role: fixed
      kind: text
      source: file
      file: policy/utility_max.py
      language: python
    harness:
      role: fixed
      kind: text
      source: generated
      language: c
    reference:
      role: input
      kind: text
      source: file
      file: ref/reference.c
      language: c
    workloads.gemm:                      # shape families the generator produces from a grid
      role: input
      kind: text
      source: generated
      indexed_by: gemm_shapes
    workloads.attn:
      role: input
      kind: text
      source: generated
      indexed_by: attn_shapes
    workloads.bg:                        # co-runner traces, one per member of the mix
      role: input
      kind: text
      source: generated
      indexed_by: mix_bg

  evaluate:
    nodes:
      declaration:
        node: adir.declaration           # VAR lines for the geometry; BUFFER and TILE lines per member
      isa_check:
        node: chiacache.isa_check
        inputs:
          source: candidate.kernels
          ext: vars.isa.ext
      build:
        node: chiacache.build
        inputs:
          source: candidate
          ext: vars.isa.ext
        resources:
          build: 1
      conformance:
        node: chiacache.conformance
        inputs:
          binary: build.binary
          reference: artifacts.reference
          shapes: artifacts.workloads.gemm
          trials: 8
      kernel_model:                      # analytical tiling model, seconds: level 1
        node: chiacache.tiling_model
        map_over:
          sp_capacity_kb: [64, 128, 256, 512, 1024, 2048]
        inputs:
          tiles: decl.TILE
          buffers: decl.BUFFER
          banks: decl.sp.banks
      kernel_curve:                      # kernel-level simulation, minutes per member: level 2
        node: gem5_kernel
        map_over:                        # the grid is the union of capacities any geometry can reach
          sp_capacity_kb: [64, 128, 256, 512, 1024, 2048]
        inputs:                          # the key is (kernel text, capacity, banks): a geometry-only step is a cache hit
          binary: build.binary
          shapes: artifacts.workloads.gemm
          sp_banks: decl.sp.banks
        when:
          - conformance.pass
          - goal.1 ge quantile(archive.goal.1, 0.8)
      mrc:                               # miss-rate curves of the co-runners; once per run
        node: chiacache.mrc
        pin: true
        inputs:
          traces: artifacts.workloads.bg
          line_bytes: vars.l2.line_bytes
          max_kb: 2048
      partition:                         # utility partition over the curves, milliseconds
        node: chiacache.utility_partition
        inputs:
          kernel_curve: kernel_curve.cycles
          mrcs: mrc.curves
          size_kb: decl.l2.size_kb
          ways: decl.l2.ways
          sp_ways: vars.l2.sp_ways
          select: oracle                 # each kernel sees the partition that suits it (the paper's setting);
                                         # `policy` with `policy: artifacts.policy` is the mobile setting
          weights: vars.mix.weights
      area:
        node: chiacache.sram_area
        inputs:
          size_kb: decl.l2.size_kb
          ways: decl.l2.ways
          banks: decl.sp.banks
      fs:                                # full-system simulation, hours: level 3
        node: gem5_fs
        inputs:
          binary: build.binary
          size_kb: decl.l2.size_kb
          ways: decl.l2.ways
          sp_ways: vars.l2.sp_ways
          banks: decl.sp.banks
          traces: artifacts.workloads.bg
          weights: vars.mix.weights
          select: oracle
        when:
          - goal.2 ge quantile(archive.goal.2, 0.9)
        resources:
          sim_fs: 1
      # The bilevel form replaces kernels, kernel_model and kernel_curve
      # with an inner instance over the kernel text, cached under the
      # capacity and bank count the outer candidate projects to:
      #
      # kernel_opt:
      #   node: adir.instance
      #   inputs:
      #     file: ../cacheflex_kernel/run.yaml
      #     bindings:
      #       l2.size_kb: decl.l2.size_kb
      #       l2.ways: decl.l2.ways
      #       l2.sp_ways: decl.l2.ways
      #       sp.banks: decl.sp.banks
      #     budget: {iterations: 60, wall_hours: 2}
    feedback: [conformance.detail, kernel_curve.stats, partition.detail]

  constraints:
    - {metric: declaration.ok, eq: true, hard: true}
    - {metric: isa_check.ok, eq: true, hard: true}
    - {metric: build.ok, eq: true, hard: true}
    - {metric: conformance.pass, eq: true, hard: true}
    - {metric: area.mm2, le: 1.1 * seed.area.mm2}

  goal:
    fidelity:                            # every candidate at level 1; the top fifth reach level 2; the top tenth of those level 3
      - minimize: min(kernel_model.cycles)     # the kernel at the capacity that suits it, which the oracle grants
      - maximize: partition.throughput
      - maximize: fs.throughput
    score:
      rule: ratio_to_seed
      infeasible: slack

  knowledge: chiacache/knowledge
  task:
    context: task.md

  search:
    backend: adaevolve
    iterations: 300
    parallel: 6
    diff_mode: true
    max_solution_bytes: 200000
    retries: 2
    database:
      use_migration: true
      use_paradigm_breakthrough: true
      diversity_strategy: metric
    seeds:
      generated: [paper, mobile_baseline]   # geometry presets with the cacheflex_kernel kernels tuned under each
    context:
      programs: 1
      show: declarations_metrics
    prompts:
      variants:
        operator: [structural, local, free]
        member_focus: [none, one]
      sample: ucb
    tactics:
      sources: [unexplored_values, worst_member, worst_constraint]
      select: ucb
      window: 20
    models:
      solution:
        agent: codex
        model: gpt-6-astra
        effort: high
      guide:
        agent: codex
        model: gpt-6-astra
        effort: xhigh
    budget:
      wall_hours: 96
      node_runs: 4000
      llm_calls: 1200
    stop:
      plateau_iterations: 60

  archive:
    store: sqlite
    path: cacheflex.db
    query_tool: true
    keep_transcripts: true
    report:
      front_only: false
