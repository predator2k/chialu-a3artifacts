# The synth_recipe block under a numeric backend: the recipe is rendered
# by a node from four searched variables (the ABC pass family, the
# mapping effort, opt -full, SHARE), so a candidate is a declaration
# alone and `grid` enumerates the 48 points. The same synth, equivalence
# and timing nodes as synth_recipe; the domain library and the RTL are
# the synth_recipe ones (symlinks).

# ---- CHIA cluster (read by `chia up`) ---------------------------------
cluster_name: synth_recipe_grid

provider:
  head_ip: ${THIS_MACHINE}

auth:
  ssh_user: ${USER}

available_node_types:
  eda:
    resources:
      eda: 16
    num_workers: 1
    compatible_ips: ["${THIS_MACHINE}"]
    worker_env_commands:
      - export PATH=$HOME/miniconda3/envs/chia_env/bin:$HOME/tools/bin:$HOME/tools/oss-cad-suite/bin:$PATH

head_env_commands:
  - export PATH=$HOME/miniconda3/envs/chia_env/bin:$PATH

head_start_ray_commands:
  - ray stop
  - ray start --head --port=6379 --include-dashboard=false --dashboard-agent-listen-port=0

worker_start_ray_commands:
  - ray stop
  - ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0

cache:
  synth_recipe:
    cache: true
  equiv_netlist:
    cache: true

# ---- ADIR instance (read by `adir`) -----------------------------------
adir:
  module: chirecipe.RecipeGrid
  run_dir: run/synth_recipe_grid

  variables:
    block:
      fixed: alu_mixed32
    pdk:
      fixed: nangate45
    clock_ps:
      fixed: 1600
    abc.script_family:
      search: [none, resyn2, compress2rs, dch]
    abc.map_effort:
      search: {min: 1, max: 3, step: 1}
    yosys.opt_full:
      search: all
    yosys.share:
      search: all

  artifacts:
    rtl:
      role: input
      kind: text
      source: file
      file: rtl/alu_mixed32.sv
      language: systemverilog

  evaluate:
    nodes:
      declaration:
        node: adir.declaration
      render:                            # the recipe text is a node output of the declaration
        node: chirecipe.nodes.render_recipe
        inputs:
          family: decl.abc.script_family
          map_effort: decl.abc.map_effort
          opt_full: decl.yosys.opt_full
          share: decl.yosys.share
      synth:
        node: chirecipe.nodes.synth_recipe
        inputs:
          recipe: render.recipe
          rtl: artifacts.rtl
          top: vars.block
          pdk: vars.pdk
          clock_ps: vars.clock_ps
          timeout_s: 900
      equiv:
        node: chirecipe.nodes.equiv_netlist
        inputs:
          netlist: synth.netlist
          rtl: artifacts.rtl
          top: vars.block
          pdk: vars.pdk
          timeout_s: 300
        when:
          - synth.ok
      sta:
        node: chirecipe.nodes.sta
        inputs:
          netlist: synth.netlist
          pdk: vars.pdk
          clock_ps: vars.clock_ps
          fallback_delay_ps: synth.abc_delay_ps
        when:
          - synth.ok
    feedback: [synth.pass_trace]

  constraints:
    - {metric: declaration.ok, eq: true, hard: true}
    - {metric: synth.ok, eq: true, hard: true}
    - {metric: equiv.pass, eq: true, hard: true}
    - {metric: sta.delay_ps, le: 1600}

  goal:
    minimize: synth.area_um2
    score:
      rule: ratio_to_seed
      infeasible: slack

  search:
    backend: grid
    iterations: 48
    parallel_nodes: 4
    seeds:
      generated: [default]

  archive:
    store: jsonl
    path: results_db.jsonl
    report:
      front_only: false
